name: Deploy

# Deploys the site on every push to main (and on manual dispatch).
# Auth is via GitHub OIDC — a short-lived role assumption, no stored AWS keys.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent overlapping deploys from racing each other.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # CI only runs on pull requests, so a push straight to main would otherwise
  # deploy code that nothing checked. Calling the same reusable workflow a PR
  # calls means "passed CI" and "passed the deploy gate" cannot diverge.
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to request the OIDC token
      contents: read
    # Scoped to this job on purpose. At workflow level these leaked into the
    # check steps and changed a coverage number — see the note in checks.yml.
    env:
      AWS_REGION: us-east-1
      AWS_DEPLOY_ROLE: arn:aws:iam::326571719118:role/github-actions-dakotajp-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      # Build and synth aren't run here: `cdk deploy` runs the OpenNext build
      # itself, so a broken build already fails the deploy.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK deploy
        working-directory: packages/cdk
        run: npx cdk deploy DakotajpSiteStack --require-approval never
