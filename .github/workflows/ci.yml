name: CI

# Runs on every PR into main: lint, build the app, and synth the CDK stack.
# No AWS credentials are used here — nothing is deployed.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build Next.js
        run: npm run build

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: CDK synth
        working-directory: infra
        run: npx cdk synth DakotajpSiteStack --quiet
