name: CI

# Runs on every PR into main: lint, build the app, and synth the CDK stack.
# No AWS credentials are used here — nothing is deployed.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build web
        run: npm run build

      - name: CDK synth
        working-directory: packages/cdk
        run: npx cdk synth DakotajpSiteStack --quiet
