name: CI

# Runs on every PR into main. No AWS credentials are used here — nothing is
# deployed. The correctness gate lives in `checks.yml` so this and `deploy.yml`
# cannot disagree about what passing means.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # PR-only. A push to main gets this coverage from `cdk deploy`, which runs the
  # OpenNext build and synthesises the stack itself — so repeating it there would
  # only build the app twice.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Build web
        run: npm run build

      - name: CDK synth
        working-directory: packages/cdk
        run: npx cdk synth DakotajpSiteStack --quiet
