name: Debug OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Decode OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          # pad base64url and decode
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $PAD))"
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, ref, workflow_ref}'
